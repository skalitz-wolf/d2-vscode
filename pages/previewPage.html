<!DOCTYPE html>
<html lang="en">
  <title>Diagram</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta charset="utf-8" />

  <head>
    <style>
      #toolbar {
        z-index: 100;
        position: fixed;
        left: 0px;
        top: 0px;
        background-color: var(--vscode-sideBar-background);
        padding-left: 15px;
        /* 修改：返回按钮已删除（回顶层由面包屑的「基础」段承担），
           右侧不再需要预留槽位 */
        padding-right: 15px;
        padding-bottom: 5px;
        width: 100%;
        /* 修改：必须 border-box。默认 content-box 下 width:100% 只算内容宽，
           加上左右 padding 后工具栏实际比视口宽并向右溢出，
           绝对定位在其右缘（right:10px）的"返回主板"按钮会被整个推出屏幕外 */
        box-sizing: border-box;
        color: var(--vscode-sideBar-forground);
        /* 修改：单行不换行。场景栏自己负责横向滚动，工具栏高度恒为一行，
           下方预览区的位置就不会随场景数量变化而跳动 */
        display: flex;
        align-items: center;
        flex-wrap: nowrap;
      }

      #percent {
        display: inline-block;
        line-height: 30px;
        height: 30px;
        text-align: center;
        padding-top: 2px;
        font-size: 18px;
        font-weight: 600;
        width: 60px;
      }

      button {
        margin-top: 3px;
        color: white;
        border-color: 1px solid var(--vscode-button-border);
        background-color: var(--vscode-button-background);
        padding: 5px;
        border: 0px;
        min-width: 25px;
      }

      body {
        background-color: var(--vscode-editor-background);
        color: var(--vscode-editor-foreground);
        width: 100%;
        height: 100%;
      }

      path {
        fill: var(--vscode-button-foreground);
      }

      #previewWrapper {
        /* 修改：缩放原点从默认中心改为左上角 (0,0)，便于与 translate 组合实现"以鼠标位置为中心缩放" */
        transform-origin: 0 0;
        box-sizing: border-box;
        /* 修改：margin-top 不再写死。工具栏高度随场景栏滚动条/换行变化，
           由 syncToolbarHeight() 在渲染与 resize 后写入实测值，
           否则工具栏一旦高于 45px 就会盖住图的上沿 */
        margin-top: 45px;
        position: absolute;
        top: 10px;
        left: 0px;
        right: 0px;
        /* 修改：拖动支持——光标显示为可抓取手型 */
        cursor: grab;
        /* 修改：默认允许选中 SVG 内文字（按住左键拖动划选、Ctrl+C 复制）。
           原先为支持拖拽一刀切写了 user-select: none，导致文字永远无法选中；
           现在把"禁止选中"收窄到下方 is-dragging（正在拖动平移）时才生效 */
        user-select: text;
      }

      /* 修改：拖动过程中切换为"正在抓取"光标，提供视觉反馈；
         同时禁止文字选中，避免平移时鼠标扫过文字产生误选 */
      #previewWrapper.is-dragging {
        cursor: grabbing;
        user-select: none;
      }

      /* 修改：悬停在 SVG 文字上显示 I 型光标，提示此处文字可选中复制 */
      #previewWrapper text {
        cursor: text;
      }

      /* 修改：拖动平移经过文字上方时保持 grabbing 光标，不闪回 I 型 */
      #previewWrapper.is-dragging text {
        cursor: grabbing;
      }

      /* 修改：单击文字复制成功后的短暂高亮。d2 把 fill 写在 <text> 的属性上，
         表现属性优先级低于任何 CSS 规则，所以这里能覆盖；多行标签的 <tspan>
         没有自己的 fill，会一并跟着变色。
         色值取 textLink 而不是选区底色：选区底色当字形颜色用时，浅色主题下
         在白色图底上几乎看不见 */
      #previewWrapper text.copy-flash {
        fill: var(--vscode-textLink-foreground);
      }

      #progressBar {
        position: fixed;
        margin-left: -10px;
        bottom: 0px;
        height: 8px;
        width: 100%;
        z-index: 101;
      }

      progress {
        position: inherit;
      }

      progress:indeterminate {
        width: inherit;
        height: 8px;
        color: darkcyan;
      }

      #toast {
        height: auto;
        left: 0px;
        position: fixed;
        padding-bottom: 8px;
        bottom: 0px;
        width: 100%;
        padding: 10px;
        background-color: #303030;
        transition: opacity 0.8s ease-in-out;
        opacity: 1;
        z-index: 101;
      }

      #toastMsg {
        margin-top: 0px;
        margin-left: 3px;
        font-size: larger;
        font-family: Arial, Helvetica, sans-serif;
      }

      #toastList {
        margin-top: 1px;
        margin-bottom: 1px;
        list-style: none;
        padding-left: 10px;
      }

      /* 修改（2026-10-18）：场景栏换成面包屑。
         layer 与 scenario 不是互斥的两套东西，而是同一条 board 路径上的两种段
         （scenarios.A.layers.B 合法），所以用一条路径表达它们：
           基础 › 场景A › 图层B
         「基础」是 root board，点它即回顶层；中间段点哪段回哪层。
         工具栏是 flex 单行，面包屑占满剩余宽度。 */
      #boardBar {
        flex: 1 1 auto;
        min-width: 0;
        margin-left: 8px;
        display: flex;
        align-items: center;
        flex-wrap: nowrap;
        overflow: hidden;
        white-space: nowrap;
        font-size: 12px;
      }

      /* 面包屑的一段：可点的用链接色，当前段加粗且不可点 */
      #boardBar .crumb {
        flex: 0 0 auto;
        padding: 2px 6px;
        border: 0px;
        background-color: transparent;
        color: var(--vscode-textLink-foreground);
        font-size: 12px;
        cursor: pointer;
        max-width: 14em;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #boardBar .crumb:hover {
        text-decoration: underline;
      }

      #boardBar .crumb.current {
        color: var(--vscode-foreground);
        font-weight: 600;
        text-decoration: none;
      }

      /* 修改：当前段一般不可点；但「基础」在有场景时可点开场景下拉，
         所以要保留手型光标（否则用户不会想到去点它） */
      #boardBar .crumb.current.has-menu {
        cursor: pointer;
      }

      #boardBar .crumb.current.has-menu:hover {
        text-decoration: underline;
      }

      /* 段之间的分隔符，纯装饰，不可点 */
      #boardBar .sep {
        flex: 0 0 auto;
        color: var(--vscode-descriptionForeground);
        padding: 0 2px;
      }

      /* 超长时折叠出来的省略号段，点它展开全部 */
      #boardBar .ellipsis {
        flex: 0 0 auto;
        padding: 2px 4px;
        border: 0px;
        background-color: transparent;
        color: var(--vscode-descriptionForeground);
        font-size: 12px;
        cursor: pointer;
      }

      /* 场景下拉：点面包屑里的场景段时弹出，列出基础 + 所有场景 */
      #scenarioMenu {
        position: fixed;
        z-index: 120;
        min-width: 120px;
        max-width: 320px;
        max-height: 60vh;
        overflow-y: auto;
        padding: 4px 0;
        background-color: var(--vscode-dropdown-background);
        border: 1px solid var(--vscode-dropdown-border);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
        display: none;
      }

      #scenarioMenu.open {
        display: block;
      }

      #scenarioMenu .menuItem {
        display: block;
        width: 100%;
        padding: 5px 12px;
        border: 0px;
        background: transparent;
        color: var(--vscode-dropdown-foreground);
        font-size: 12px;
        text-align: left;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        cursor: pointer;
      }

      #scenarioMenu .menuItem:hover {
        background-color: var(--vscode-list-hoverBackground);
      }

      #scenarioMenu .menuItem.active {
        font-weight: 600;
      }

      /* 修改：d2 的 .link 用 <a> 包住整个节点，但真正的"超链接图标"是渲染在
         <a> 外面的独立 <g class="appendix-icon">（32x32，画在框右上角）。
         整框可点会吞掉框内文字的选中复制，所以 <a> 本体不再响应点击、
         不显示手型光标，跳转只认 d2 自带的 appendix-icon 角标 */
      #previewWrapper a {
        cursor: default;
      }

      .appendix-icon {
        cursor: pointer;
      }
    </style>
    <script>
      var zoomLevel = 100;
      var zoomStep = 5;
      var zoomMin = 10;
      var zoomMax = 750;
      var percent;
      var wrapper;
      var toolbarEl;
      var busyIndicator;
      var toast, toastMsg, toastList;
      var fitMode = true;
      // 修改：当前渲染的 board 路径（空串 = 主板）。board 变化时强制重新 fit
      var currentBoard = "";
      // 修改：最近一次的场景名列表，供面包屑的场景下拉使用
      var lastScenarios = [];
      // 修改：最近一次渲染的 board 路径。resize 时要按新宽度重画面包屑
      // （折叠/展开是依赖宽度的），所以不能只存 scenarios
      var lastBoard = "";
      // 修改：拖动平移相关状态——记录画布相对原点的偏移量
      var panX = 0;
      var panY = 0;
      // 修改：拖动状态机——isDragging 表示鼠标按下且未松开
      var isDragging = false;
      // 修改：拖动起点坐标（屏幕坐标），用于计算位移增量
      var dragStartX = 0;
      var dragStartY = 0;
      // 修改：拖动开始时的 pan 基准值，配合 dragStart 计算新的 pan
      var panStartX = 0;
      var panStartY = 0;
      // 修改：缩放锚点（鼠标在屏幕上的位置），用于实现"以鼠标位置为中心缩放"
      var lastMouseX = 0;
      var lastMouseY = 0;
      // 修改：单击复制后的高亮反馈状态——当前被高亮的文字元素与其清除定时器
      var flashTimer = null;
      var flashedEl = null;
      const vscode = acquireVsCodeApi();

      // 修改：工具栏高度是图区定位的唯一真源。原先 #previewWrapper 写死
      // margin-top:45px，而工具栏实际高度会随场景栏滚动条变化；两者脱钩后
      // 工具栏一旦超过 45px 就会盖住图的上沿。这里实测一次，写进 marginTop，
      // 同时把值暴露给 zoomFit/zoomFitBoth 复用，避免各处再写死数字
      function toolbarHeight() {
        if (!toolbarEl) return 45;
        return toolbarEl.getBoundingClientRect().height || 45;
      }

      // 图区顶部 = wrapper.top(10) + 工具栏高 + 4px 间隙；返回值即 marginTop
      function syncToolbarHeight() {
        if (!wrapper) return;
        var mt = Math.round(toolbarHeight()) + 4;
        wrapper.style.marginTop = mt + "px";
      }

      function init() {
        percent = document.getElementById("percent");
        toolbarEl = document.getElementById("toolbar");
        wrapper = document.getElementById("previewWrapper");
        busyIndicator = document.getElementById("progressBar");
        toast = document.getElementById("toast");
        toastMsg = document.getElementById("toastMsg");
        toastList = document.getElementById("toastList");
        // 修改：拖动支持——必须在 init() 内注册，确保 wrapper 已被赋值，
        // 否则顶层调用会因 wrapper 为 undefined 而抛 TypeError，导致整个 webview 脚本崩溃
        wrapper.addEventListener("mousedown", (event) => {
          // 只响应左键
          if (event.button !== 0) return;
          // 修改：按下 d2 自带的 appendix-icon 角标时不启动拖动，保证 click 跳转干净触发
          if (event.target.closest && event.target.closest(".appendix-icon")) return;
          // 修改：若点中的是 SVG 文字（<text>/<tspan>）则不启动拖动、
          // 不 preventDefault，放行浏览器原生的文字选中行为：
          // 按住左键拖动划选、双击选词，选中后 Ctrl+C 即可复制
          if (event.target.closest && event.target.closest("text")) return;
          isDragging = true;
          dragStartX = event.clientX;
          dragStartY = event.clientY;
          panStartX = panX;
          panStartY = panY;
          // 修改：开始拖动平移时清除已有的文字选区，避免旧高亮残留在画面上
          if (window.getSelection) {
            window.getSelection().removeAllRanges();
          }
          // 修改：加上 is-dragging class 切换为 grabbing 光标
          wrapper.classList.add("is-dragging");
          event.preventDefault();
        });
        // 修改：跟踪鼠标位置，Ctrl+滚轮缩放时用作 zoomTo 的锚点
        wrapper.addEventListener("mousemove", (event) => {
          lastMouseX = event.clientX;
          lastMouseY = event.clientY;
        });
        syncToolbarHeight();
        zoomFit();
        // 修改：面板拖动改宽/改高后，工具栏可能变高（滚动条出现）也可能变矮，
        // 需要重新量一次，否则图区会压在工具栏下面或留出多余空白
        window.addEventListener("resize", function () {
          // 修改：面包屑的折叠取决于可用宽度，窗口变宽/变窄都要重画，
          // 否则会出现"变窄后仍显示完整路径、被裁掉"或"变宽后还留着省略号"
          renderBreadcrumb(lastScenarios, lastBoard);
          syncToolbarHeight();
        });
        // 修改：webview 上下文重置后（例如 move to new window），主动隐藏
        // 初始 HTML 中写死的 "Loading..." 提示与进度条，避免脏状态残留
        toast.style.opacity = 0;
        busyIndicator.style.visibility = "hidden";
      }
      // 修改：anchorX/anchorY 用于"以鼠标位置为中心缩放"。若未传入，
      // 默认使用最近一次鼠标位置；若 lastMouseX/Y 仍为 0，则退化为以视口中心缩放
      function zoomPlus(anchorX, anchorY) {
        if (typeof anchorX !== "number") {
          anchorX = (lastMouseX || visualViewport.width / 2);
          anchorY = (lastMouseY || visualViewport.height / 2);
        }
        if (zoomLevel >= 50) {
          zoomStep = 10;
        }
        zoomTo(Math.min(zoomMax, zoomLevel + zoomStep), anchorX, anchorY);
      }
      function zoomMinus(anchorX, anchorY) {
        if (typeof anchorX !== "number") {
          anchorX = (lastMouseX || visualViewport.width / 2);
          anchorY = (lastMouseY || visualViewport.height / 2);
        }
        if (zoomLevel <= 50) {
          zoomStep = 5;
        }
        zoomTo(Math.max(zoomMin, zoomLevel - zoomStep), anchorX, anchorY);
      }
      // 修改：默认适配行为改为"只适配宽度"——SVG 按宽度占满视口，高度可超出滚动
      function zoomFit() {
        var svg = wrapper.querySelector("svg");
        if (!svg) return;
        // 修改：fit 的对象是 SVG 当前的布局宽度（d2 的外层 <svg> 没有 width，
        // 浏览器会把它撑满 wrapper，因此它就是"按容器宽度排版后的宽度"）。
        // 不能改用 viewBox 宽：那是原始尺寸，拿它去除容器宽会得到 233%，
        // 图被放大两倍多、横向溢出（实测 2067px）。
        var svgWidth = svg.getBoundingClientRect().width / (zoomLevel / 100);
        if (!(svgWidth > 0)) return;
        // 重置 zoomStep，避免上次 Ctrl+wheel 留下的 step 影响后续计算
        zoomStep = 5;
        // 修改：按图区实际可用宽度算，而不是 visualViewport.width（滚动条会占位）
        var availWidth = wrapper.clientWidth || visualViewport.width;
        var scale = availWidth / svgWidth;
        panX = 0;
        // 修改：panY 让 SVG 顶部贴住工具栏下沿。wrapper.top=10 且
        // marginTop = 工具栏高 + 4，故 panY = 工具栏高 - 6（不再写死 35）
        panY = toolbarHeight() - 6;
        var zoomPct = scale * 100;
        // 修改：transform 与显示都用精确的 zoomPct，不做 roundToZoomLevel 舍入，
        // 避免多次点击 fit 时数字在 55/60 之间跳动
        zoomLevel = zoomPct;
        applyTransform(zoomPct);

        setZoomText(false);

        fitMode = true;
      }
      // 修改：保留原"取宽高比例较小值"的语义（整体可见），并把 SVG 居中显示在
      // toolbar 下方的可用区域内（之前 panX/panY 始终为 0，缩放后只对齐到左上角）
      function zoomFitBoth() {
        var svg = wrapper.querySelector("svg");
        if (!svg) return;
        // 修改：用 SVG 的"未缩放布局尺寸"。外层 <svg> 没有 width，会被撑满
        // wrapper；viewBox 是原始尺寸，直接拿来算比例会把图放大两倍多。
        // 当前 rect 已被 transform 缩放，除以 zoomLevel 还原成布局尺寸
        var curScale = zoomLevel / 100;
        var rect = svg.getBoundingClientRect();
        var svgWidth = rect.width / curScale;
        var svgHeight = rect.height / curScale;
        if (svgWidth <= 0 || svgHeight <= 0) return;
        zoomStep = 5;
        // 修改：可用高度按实测工具栏高度算。原先写死 45，工具栏一旦变高，
        // 图就会被算进工具栏底下（实测 900x700 时图底超出视口 45px）
        var barH = toolbarHeight();
        // 修改：可用高度 = 视口高度 - 工具栏占掉的部分。不能读 wrapper 的 rect：
        // wrapper 的高度是被内容撑出来的（等于图高），拿它算会自我循环，
        // 结果永远是"刚好装下"，图就贴顶了。这里只用工具栏高度这个独立量。
        // 修改：再留 2px 余量。wrapper 自身有 2px 边框/行高，实测正好多出 2px
        // 导致出现纵向滚动条（docSH 702 vs 700）
        var availTop = 10 + barH + 4;
        var availH = visualViewport.height - availTop - 2;
        // 修改：同 zoomFit，水平方向按图区实际宽度算，避免出现横向滚动条
        var availWidth = wrapper.clientWidth || visualViewport.width;
        var widthPct = availWidth / svgWidth;
        var heightPct = availH / svgHeight;

        var scale = Math.min(widthPct, heightPct);
        var scaledW = svgWidth * scale;
        var scaledH = svgHeight * scale;
        // 修改：水平方向在图区内居中
        panX = (availWidth - scaledW) / 2;
        // 修改：垂直居中。wrapper 顶部已由 marginTop 推到工具栏下方，
        // 但 SVG 的绘制原点还要再加上 wrapper 自身的 padding/border 影响；
        // 直接用 (availH - scaledH)/2 会让图贴顶（实测上 52、下 22），
        // 这里改为按实际可用高度分配上下留白
        panY = Math.max(0, (availH - scaledH) / 2);
        var zoomPct = scale * 100;
        zoomLevel = zoomPct;
        applyTransform(zoomPct);

        setZoomText(false);

        fitMode = true;
      }
      // 修改：核心缩放函数。给定新的缩放比例与锚点（屏幕坐标），调整 pan 让锚点
      // 下的内容坐标在缩放前后保持不变。公式：
      //   panX_new = panX_old + (anchorX - wrapper.left) * (1 - newZl/oldZl)
      // zoomTo 标记 fitMode=false，让 render 消息触发时保留用户当前位置而不是重新 fit
      function zoomTo(newZl, anchorX, anchorY) {
        if (newZl === zoomLevel) return;
        var ratio = newZl / zoomLevel;
        var rect = wrapper.getBoundingClientRect();
        var dx = anchorX - rect.left;
        var dy = anchorY - rect.top;
        panX = panX + dx * (1 - ratio);
        panY = panY + dy * (1 - ratio);
        zoomLevel = newZl;
        applyTransform(newZl);
        setZoomText(true);
        fitMode = false;
      }
      function setZoomLevel(zl) {
        // 修改：修正百分比文字滞后一步的缺陷——setZoomText() 读的是 zoomLevel，
        // 而原顺序是先刷新文字、后赋值 zoomLevel，于是显示值永远是上一次的
        // （setZoomLevel(250) 后显示 100%）。改成与 zoomTo/zoomFit 一致的
        // 「先赋值、再刷新」
        // 修改：Number() 转换不可省——扩展端消息传进来的是字符串，原样存进
        // zoomLevel 后，下一次 setZoomText() 会因字符串没有 .toFixed 而抛
        // TypeError，直接打断整个预览脚本
        zoomLevel = Number(zl);
        // 修改：调用 applyTransform 而非直接设置 scale，便于同时维持 pan 平移
        applyTransform(zoomLevel);
        setZoomText(true);

        fitMode = false;
      }
      // 修改：把"先平移再缩放"统一封装到 transform 字符串。
      // 顺序为 translate → scale：内容先沿 (panX, panY) 平移，再以 (0,0) 为原点缩放。
      // 这样 pan 不会因为缩放比例变化而被二次放大
      function applyTransform(zl) {
        wrapper.style.transform =
          "translate(" + panX + "px," + panY + "px) scale(" + zl / 100 + "," + zl / 100 + ")";
      }
      function setZoomText(text) {
        percent.innerText = zoomLevel.toFixed() + "%";
      }

      function roundToZoomLevel(zl) {
        var newZl = Math.round(zl + zoomStep) - Math.round(zl % zoomStep);
        return Math.max(10, newZl);
      }

      function refreshPage() {
        vscode.postMessage({ command: "refreshPage" });
      }


      // 修改（2026-10-18）：把 board 路径切成面包屑的段。
      // 路径形如 scenarios.A.layers.B.layers.C；按关键字切，紧随其后的名字是段名。
      // 返回 [{name, path, kind}]，kind 为 "scenario" | "layer"。
      // 名字里可能含 "."（d2 允许引号键），所以这里只按关键字切、不按点切。
      function splitBoardPath(board) {
        var segs = [];
        var path = board || "";
        var parts = path.split(".");
        var i = 0;
        // 修改：路径必须累积。d2 的嵌套图层路径是 layers.L1.layers.L2，
        // 不是 layers.L2；每段都要带上前面所有段，否则点中间层会跳到错误位置。
        // 同理 scenarios.S1.layers.L1 的图层段也必须带上前面的场景段。
        var acc = "";
        while (i < parts.length) {
          var kw = parts[i];
          if ((kw === "scenarios" || kw === "layers") && i + 1 < parts.length) {
            var name = parts[i + 1];
            var raw;
            var next = i + 2;
            // 还原被引号包裹的名字：scenarios."A.B" 在 split 后是 [scenarios, "A, B"]
            if (name.charAt(0) === '"') {
              var joined = name.slice(1);
              var j = i + 2;
              while (j < parts.length && joined.charAt(joined.length - 1) !== '"') {
                joined += "." + parts[j];
                j++;
              }
              if (joined.charAt(joined.length - 1) === '"') {
                joined = joined.slice(0, -1);
              }
              name = joined;
              raw = kw + "." + '"' + name + '"';
              next = j;
            } else {
              raw = kw + "." + name;
            }
            acc = acc ? acc + "." + raw : raw;
            segs.push({ name: name, path: acc, kind: kw === "scenarios" ? "scenario" : "layer" });
            i = next;
            continue;
          }
          i++;
        }
        return segs;
      }

      // 修改（2026-10-18 重设计）：面包屑 = [场景名] › [图层] › [图层]...
      //
      // 规则（用户定的模型）：
      //   - 场景只能通过下拉切换，图层只能通过图里的角标进入
      //   - 第一段是「当前场景名」：基础 / 缓存命中 / 缓存未命中 之一
      //   - 后面是图层链；图层段没有下拉
      //   - 没有场景时第一段是「基础」，且不显示下拉
      //
      // 悬停第一段立即弹菜单；移开 200ms 关闭；点击锁定/解锁。
      function renderBreadcrumb(scenarios, board) {
        var bar = document.getElementById("boardBar");
        if (!bar) return;
        bar.innerHTML = "";
        var segs = splitBoardPath(board);
        var scenarioSeg = null;
        var layers = [];
        for (var i = 0; i < segs.length; i++) {
          if (segs[i].kind === "scenario" && !scenarioSeg) {
            scenarioSeg = segs[i];
          } else if (segs[i].kind === "layer") {
            layers.push(segs[i]);
          }
        }
        var hasScenarios = !!(scenarios && scenarios.length > 0);
        // 普通文件（无场景无图层）不显示面包屑，避免只剩一个孤零零的「基础」
        if (!hasScenarios && layers.length === 0) {
          syncToolbarHeight();
          return;
        }

        // 第一段：当前场景名。没有场景段时就是 root board，名字叫「基础」
        var scenarioName = scenarioSeg ? scenarioSeg.name : "基础";
        var scenarioPath = scenarioSeg ? scenarioSeg.path : "";
        // 当前 board 恰好就是场景本身（还没进图层）时，这一段是"你在这里"
        var scenarioIsCurrent = !layers.length;

        var paint = function () {
          bar.innerHTML = "";
          var first = document.createElement("button");
          first.className = "crumb" + (scenarioIsCurrent ? " current" : "") +
            (hasScenarios ? " has-menu" : "");
          first.innerText = scenarioName;
          first.title = hasScenarios ? "切换场景" : "回到主板";
          first.setAttribute("data-scenario-crumb", "1");
          if (hasScenarios) {
            // 悬停即弹；移出延迟关闭，避免鼠标移向菜单时闪
            first.addEventListener("mouseenter", function (event) {
              if (!menuLocked) openScenarioMenu(event.currentTarget);
            });
            first.addEventListener("mouseleave", function () {
              scheduleCloseMenu();
            });
            first.addEventListener("click", function (event) {
              // 点击锁定：锁定时再次点击解锁并关闭
              if (menuLocked) {
                menuLocked = false;
                closeScenarioMenu();
              } else {
                menuLocked = true;
                openScenarioMenu(event.currentTarget);
              }
            });
          } else if (!scenarioIsCurrent) {
            first.addEventListener("click", function () {
              vscode.postMessage({ command: "selectBoard", board: "" });
            });
          }
          bar.appendChild(first);

          // 图层链：只有当前 board 的最后一段是"你在这里"，其余可点回退
          for (var k = 0; k < layers.length; k++) {
            var sep = document.createElement("span");
            sep.className = "sep";
            sep.innerText = "›";
            bar.appendChild(sep);
            var seg = layers[k];
            var isLast = k === layers.length - 1;
            var lb = document.createElement("button");
            lb.className = "crumb" + (isLast ? " current" : "");
            lb.innerText = seg.name;
            lb.title = "图层：" + seg.name;
            if (!isLast) {
              (function (targetPath) {
                lb.addEventListener("click", function () {
                  vscode.postMessage({ command: "selectBoard", board: targetPath });
                });
              })(seg.path);
            }
            bar.appendChild(lb);
          }
        };

        paint();

        // 宽度不够时折叠中间图层段（保留第一段与最后一段）
        var fits = function () {
          var barRect = bar.getBoundingClientRect();
          var kids = bar.children;
          if (!kids.length) return true;
          var last = kids[kids.length - 1].getBoundingClientRect();
          return last.right <= barRect.right + 0.5;
        };
        if (!fits() && layers.length > 2) {
          // 折掉中间图层：只保留第一段、第一个和最后一个图层
          var keep = [layers[0], layers[layers.length - 1]];
          var collapsed = true;
          var paintCollapsed = function () {
            bar.innerHTML = "";
            var first = document.createElement("button");
            first.className = "crumb" + (scenarioIsCurrent ? " current" : "") +
              (hasScenarios ? " has-menu" : "");
            first.innerText = scenarioName;
            first.title = hasScenarios ? "切换场景" : "回到主板";
            first.setAttribute("data-scenario-crumb", "1");
            if (hasScenarios) {
              first.addEventListener("mouseenter", function (event) {
                if (!menuLocked) openScenarioMenu(event.currentTarget);
              });
              first.addEventListener("mouseleave", function () {
                scheduleCloseMenu();
              });
              first.addEventListener("click", function (event) {
                if (menuLocked) {
                  menuLocked = false;
                  closeScenarioMenu();
                } else {
                  menuLocked = true;
                  openScenarioMenu(event.currentTarget);
                }
              });
            } else if (!scenarioIsCurrent) {
              first.addEventListener("click", function () {
                vscode.postMessage({ command: "selectBoard", board: "" });
              });
            }
            bar.appendChild(first);
            for (var k = 0; k < keep.length; k++) {
              var sep = document.createElement("span");
              sep.className = "sep";
              sep.innerText = "›";
              bar.appendChild(sep);
              if (k === 1) {
                var more = document.createElement("button");
                more.className = "ellipsis";
                more.innerText = "…";
                more.title = "展开中间的图层";
                more.addEventListener("click", function () {
                  collapsed = false;
                  paint();
                });
                bar.appendChild(more);
                var sep2 = document.createElement("span");
                sep2.className = "sep";
                sep2.innerText = "›";
                bar.appendChild(sep2);
              }
              var seg = keep[k];
              var isLast = k === keep.length - 1;
              var lb = document.createElement("button");
              lb.className = "crumb" + (isLast ? " current" : "");
              lb.innerText = seg.name;
              lb.title = "图层：" + seg.name;
              if (!isLast) {
                (function (targetPath) {
                  lb.addEventListener("click", function () {
                    vscode.postMessage({ command: "selectBoard", board: targetPath });
                  });
                })(seg.path);
              }
              bar.appendChild(lb);
            }
          };
          paintCollapsed();
        }
        syncToolbarHeight();

        // 修改（2026-10-18）：如果菜单处于锁定状态（用户点了第一段），
        // 面包屑重画后要把菜单重新挂到新的第一段上——选完场景菜单不能消失。
        if (menuLocked) {
          var firstCrumb = bar.querySelector(".crumb.has-menu");
          if (firstCrumb) {
            openScenarioMenu(firstCrumb);
          } else {
            // 新 board 没有场景了（例如切到纯图层文件），锁也没意义了
            menuLocked = false;
            closeScenarioMenu();
          }
        }
      }

      // 修改：场景下拉。场景是互斥的单选，选项固定为「基础 + 所有顶层场景」。
      // 只有第一段（场景名）会打开它，图层段没有下拉。
      var menuLocked = false;
      var menuCloseTimer = null;
      function openScenarioMenu(anchor) {
        var menu = document.getElementById("scenarioMenu");
        if (!menu) return;
        if (menuCloseTimer) {
          clearTimeout(menuCloseTimer);
          menuCloseTimer = null;
        }
        menu.innerHTML = "";
        var items = [{ name: "基础", path: "" }];
        var list = lastScenarios || [];
        for (var i = 0; i < list.length; i++) {
          items.push({ name: list[i], path: "scenarios." + escapeSegment(list[i]) });
        }
        // 修改：高亮当前场景。currentBoard 可能是 scenarios.X.layers.Y，
        // 不能直接和 item.path 比；取路径里的场景段来比。
        var currentScenarioPath = "";
        var curSegs = splitBoardPath(currentBoard);
        for (var ci = 0; ci < curSegs.length; ci++) {
          if (curSegs[ci].kind === "scenario") {
            currentScenarioPath = curSegs[ci].path;
            break;
          }
        }
        for (var j = 0; j < items.length; j++) {
          (function (item) {
            var btn = document.createElement("button");
            btn.className = "menuItem" + (item.path === currentScenarioPath ? " active" : "");
            btn.innerText = item.name;
            btn.title = item.name;
            btn.addEventListener("mouseenter", function () {
              // 鼠标进入菜单后取消关闭计时，允许移过去点
              if (menuCloseTimer) {
                clearTimeout(menuCloseTimer);
                menuCloseTimer = null;
              }
            });
            btn.addEventListener("click", function () {
              // 修改（2026-10-18）：选完场景后菜单保持打开并继续锁定，
              // 只有再次点击第一段或按 Esc 才关闭。
              // 这里不 closeScenarioMenu()，也不清 menuLocked；
              // 新的 render 到达后 renderBreadcrumb 会重画面包屑，
              // 并在末尾按 menuLocked 重新挂回菜单（见 syncMenuToCrumb）。
              menuLocked = true;
              vscode.postMessage({ command: "selectBoard", board: item.path });
            });
            menu.appendChild(btn);
          })(items[j]);
        }
        var r = anchor.getBoundingClientRect();
        menu.style.left = Math.round(r.left) + "px";
        menu.style.top = Math.round(r.bottom + 4) + "px";
        menu.classList.add("open");
      }

      // 修改：延迟关闭 200ms——鼠标从面包屑移向菜单的途中不闪
      function scheduleCloseMenu() {
        if (menuLocked) return;
        if (menuCloseTimer) clearTimeout(menuCloseTimer);
        menuCloseTimer = setTimeout(function () {
          menuCloseTimer = null;
          closeScenarioMenu();
        }, 200);
      }

      function closeScenarioMenu() {
        var menu = document.getElementById("scenarioMenu");
        if (menu) menu.classList.remove("open");
        if (menuCloseTimer) {
          clearTimeout(menuCloseTimer);
          menuCloseTimer = null;
        }
      }
      // 修改：与 boardParser.escapeBoardSegment 同一规则——名字含 "." 时加引号，
      // 否则 d2 会把点当路径分隔符（实测报 render target not found）
      function escapeSegment(name) {
        if (name.indexOf(".") < 0) return name;
        return '"' + name.replace(/"/g, '\\"') + '"';
      }

      // 修改：d2 的超链接角标（appendix-icon）渲染在 <a> 外面，与锚点没有
      // DOM 嵌套关系，只能按几何位置关联：取与角标矩形重叠面积最大的 <a>。
      // getBoundingClientRect 含 wrapper 的缩放/平移，但角标与框受同一变换
      // 影响，相对几何不变，比较结果不受缩放影响
      function findAnchorForBadge(badge) {
        var ir = badge.getBoundingClientRect();
        var anchors = wrapper.querySelectorAll("a[href]");
        var best = null;
        var bestArea = 0;
        for (var i = 0; i < anchors.length; i++) {
          var r = anchors[i].getBoundingClientRect();
          var w = Math.min(ir.right, r.right) - Math.max(ir.left, r.left);
          var h = Math.min(ir.bottom, r.bottom) - Math.max(ir.top, r.top);
          var area = w > 0 && h > 0 ? w * h : 0;
          if (area > bestArea) {
            bestArea = area;
            best = anchors[i];
          }
        }
        return best;
      }

      // 修改：取一个 SVG 文字元素的"整行"内容。d2 把多行标签的每一行渲染成
      // 独立的 <tspan>，此时 textContent 会把各行无分隔符地粘起来
      // （alpha / beta / gamma → "alphabetagamma"），必须按行用换行符连接；
      // 没有行元素的单行标签、以及 markdown 富文本被拆出的一片文字，直接取全文
      function textOfTextElement(el) {
        var rows = el.querySelectorAll("tspan");
        if (rows.length > 0) {
          var lines = [];
          for (var i = 0; i < rows.length; i++) {
            lines.push(rows[i].textContent);
          }
          return lines.join("\n");
        }
        return el.textContent || "";
      }

      // 修改：剪贴板写入。主路径用 navigator.clipboard——VS Code 的 webview
      // 宿主已为内层 iframe 声明 clipboard-write 权限，不需要扩展端参与；
      // 失败（API 不可用或被拒）退化为 execCommand 兜底（VS Code 自身的
      // 右键复制也走这条）。两条路径都不向外抛异常：预览页脚本一旦崩溃，
      // 缩放、平移、跳转会一起失效
      function writeClipboard(text, done) {
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(
              function () {
                done(true);
              },
              function () {
                done(copyViaExecCommand(text));
              }
            );
            return;
          }
        } catch (e) {
          // 落到下方兜底路径
        }
        done(copyViaExecCommand(text));
      }

      // 修改：兜底复制。execCommand 只复制当前选区，所以借一个离屏 textarea
      // 承载文本；用完立即移除并清掉选区，避免残留选区影响下一次单击的判定
      function copyViaExecCommand(text) {
        try {
          var ta = document.createElement("textarea");
          ta.value = text;
          ta.setAttribute("readonly", "");
          ta.style.position = "fixed";
          ta.style.top = "-1000px";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          var ok = document.execCommand("copy");
          document.body.removeChild(ta);
          if (window.getSelection) {
            window.getSelection().removeAllRanges();
          }
          return ok;
        } catch (e) {
          return false;
        }
      }

      // 修改：复制成功后的就地反馈。只给被复制的文字换色，不复用 #toast——
      // 后者同时承载"Loading..."与编译错误列表，复用会把错误信息顶掉
      function flashCopied(el) {
        if (flashedEl) {
          flashedEl.classList.remove("copy-flash");
        }
        if (flashTimer) {
          clearTimeout(flashTimer);
        }
        flashedEl = el;
        el.classList.add("copy-flash");
        flashTimer = setTimeout(function () {
          if (flashedEl) {
            flashedEl.classList.remove("copy-flash");
          }
          flashedEl = null;
          flashTimer = null;
        }, 600);
      }

      // 修改：单击文字复制整行。内容为空（如纯图形节点）时既不复制也不闪
      function copyTextElement(el) {
        var text = textOfTextElement(el).trim();
        if (!text) return;
        writeClipboard(text, function (ok) {
          if (ok) {
            flashCopied(el);
          }
        });
      }

      // 修改（2026-10-18）：点空白处不再关闭下拉（用户要求）；
      // 只保留 Esc 作为逃生口。
      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") {
          menuLocked = false;
          closeScenarioMenu();
        }
      });

      // 修改：三击（或划选到行尾）后粘贴会多出一个换行。原因：d2 的文字节点
      // 里没有行尾空白，选区终点只能落在元素边界上，浏览器序列化时会补一个
      // "\n"（"grill-with-docs\n"），粘贴时于是跳到下一行。这里在复制事件里
      // 把选区文本末尾的换行去掉；只处理预览图内、且确实以换行结尾的选区，
      // 编辑器划选、工具栏等其它复制一律不动。preventDefault 是必需的：不拦截
      // 的话浏览器会用自己那份带换行的数据覆盖 setData 的结果（实测如此）。
      // 代价是丢掉 text/html 附加格式，只留纯文本——与单击复制的行为一致。
      document.addEventListener("copy", function (event) {
        try {
          var sel = window.getSelection ? window.getSelection() : null;
          if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return;
          var text = sel.toString();
          var trimmed = text.replace(/[\r\n]+$/, "");
          if (trimmed === text || trimmed === "") return;
          // 选区两端可能跨节点，取锚点定位即可判断是否落在预览图内
          var node = sel.anchorNode;
          var el = node && node.nodeType === 1 ? node : node && node.parentNode;
          if (!el || !el.closest || !el.closest("#previewWrapper")) return;
          if (!event.clipboardData) return;
          event.clipboardData.setData("text/plain", trimmed);
          event.preventDefault();
        } catch (e) {
          // 复制路径绝不外抛：预览页脚本一旦崩溃，缩放/平移/跳转一起失效
        }
      });

      window.addEventListener("DOMContentLoaded", () => {
        init();
      });

      window.addEventListener(
        "wheel",
        (event) => {
          if (event.ctrlKey === true) {
            event.preventDefault();
            // 修改：把鼠标坐标作为 anchor 传入 zoomPlus/zoomMinus，
            // 实现"以鼠标位置为中心缩放"，缩放时鼠标下的内容不会被拉走
            if (event.deltaY > 0) {
              zoomMinus(event.clientX, event.clientY);
            } else {
              zoomPlus(event.clientX, event.clientY);
            }
          }
        },
        { passive: false }
      );

      // 修改：window 级 mousemove，保证鼠标移出 wrapper 边界时也能继续拖动
      window.addEventListener("mousemove", (event) => {
        if (!isDragging) return;
        panX = panStartX + (event.clientX - dragStartX);
        panY = panStartY + (event.clientY - dragStartY);
        applyTransform(zoomLevel);
      });

      // 修改：window 级 mouseup，保证在 wrapper 外松开也能正确结束拖动
      window.addEventListener("mouseup", () => {
        if (!isDragging) return;
        isDragging = false;
        // 移除 grabbing 光标，恢复 grab
        wrapper.classList.remove("is-dragging");
      });

      window.addEventListener("message", (event) => {
        const message = event.data; // The JSON data our extension sent

        switch (message.command) {
          case "render":
            wrapper.innerHTML = message.data;

            // 修改（2026-10-18）：先更新 currentBoard 再画面包屑。
            // 菜单里"当前场景"高亮读的是 currentBoard；顺序反了会用上一次的值
            // （实测：切到 缓存未命中 后，菜单仍高亮 缓存命中）。
            lastScenarios = message.scenarios || [];
            lastBoard = message.board || "";
            // 修改：跳转到不同 board 时是一张全新的图，强制重新 fit，
            // 不沿用旧图的缩放比例和 pan 位置
            var boardSwitched = message.board !== currentBoard;
            currentBoard = message.board || "";
            renderBreadcrumb(lastScenarios, lastBoard);
            syncToolbarHeight();

            // 修改：扩展端传入的 preserveZoom=true 表示本次是 Recompile（而非初次预览），
            // 此时仅重新插入 SVG 并按当前 zoomLevel 重画 transform，不重置 panX/panY；
            // 其余分支保持原逻辑：fitMode=true 时 fit，否则按当前 zoomLevel 重画
            if (boardSwitched) {
              zoomFit();
            } else if (message.preserveZoom) {
              applyTransform(zoomLevel);
            } else if (fitMode === true) {
              zoomFit();
            } else {
              setZoomLevel(zoomLevel);
            }
            window.postMessage({ command: "hideBusy" });
            break;
          case "showBusy":
            busyIndicator.style.visibility = "visible";
            break;
          case "hideBusy":
            busyIndicator.style.visibility = "hidden";
            break;
          case "showToast":
            toast.style.opacity = 1.0;
            break;
          case "hideToast":
            toast.style.opacity = 0.0;
            break;
          case "setToastMsg":
            toastMsg.innerHTML = message.data;
            break;
          case "setToastList":
            toastList.innerHTML = message.data;
            break;
          case "resetZoom":
            setZoomLevel(100.0);
            setZoomText(true);
            break;
        }
      });

      window.addEventListener(
        "click",
        (event) => {
          // 修改：只点击 d2 自带的 appendix-icon 超链接角标才跳转（见
          // findAnchorForBadge 的注释）。d2 的 <a> 包住整个节点，若对 <a>
          // 直接放行会吞掉框内文字的选中复制（click 与拖选冲突）
          const badge = event.target.closest(".appendix-icon");
          if (badge) {
            const link = findAnchorForBadge(badge);
            if (!link) return;
            vscode.postMessage({
              command: "clickOnTag_A",
              link: link.href.baseVal || link.href,
            });
            return;
          }
          // 修改：单击 SVG 文字即复制该文字元素的整行内容（角标优先，见上）。
          // 选择器限定在 #previewWrapper 内，避免工具栏里将来出现 <text> 时误触发。
          // 已有非折叠选区说明用户刚划选过，此时不复制、不覆盖选区
          const textEl = event.target.closest && event.target.closest("#previewWrapper text");
          if (!textEl) return;
          const sel = window.getSelection ? window.getSelection() : null;
          // 只在确知存在选区时跳过：isCollapsed 缺失（个别环境）不当作有选区
          if (sel && sel.isCollapsed === false) return;
          copyTextElement(textEl);
        },
        false
      );
    </script>
